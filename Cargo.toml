[package]
name = "mesh2gltf"
version = "0.1.0"
edition = "2021"
description = "Disk-backed OBJ, PLY and VRML importer for georeferenced glTF assets"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/Holusion/mesh2gltf"

[dependencies]
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "tga", "tiff", "webp", "gif", "pnm", "hdr", "dds", "ico", "qoi", "exr"] }
memmap2 = "0.9"
png = "0.18"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
